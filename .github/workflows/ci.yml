name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.cxx }}, x86-64 linux)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain and libunwind
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++ clang make libunwind-dev binutils

      # Runners default to yama ptrace_scope=1, which allows ptrace of
      # descendants only; the monitor and the demo are siblings, so remote
      # capture would be refused with EPERM. Grant it so the path is genuinely
      # exercised here (the test self-skips, loudly, wherever it is not).
      - name: Allow ptrace of non-descendants
        run: |
          cat /proc/sys/kernel/yama/ptrace_scope || echo "yama not present"
          sudo sysctl -w kernel.yama.ptrace_scope=0


      - name: Build and test (unit, signal capture, remote capture)
        run: make test CXX=${{ matrix.cxx }}

      # First measurement of the x86 non-temporal store path, which the
      # author's arm64 machine cannot exercise. Runner numbers are noisy and
      # are printed to the log only; the committed results files stay as the
      # author's measured artifacts.
      - name: Beat cost on x86-64 (log only)
        run: ./bin/bench_beat

  # The default build has no libunwind and must still compile and pass the
  # cooperative path, with the remote test skipping itself.
  no-remote:
    name: build without SW_REMOTE
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain (no libunwind)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++ make binutils
      - name: Build and test
        run: make test CXX=g++ SW_REMOTE=0
